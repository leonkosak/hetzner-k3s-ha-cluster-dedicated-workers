---
- name: Bootstrap OS baseline on all nodes
  hosts: k3s_masters:k3s_workers
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  roles:
    - common
  tasks:
    - name: Reboot MicroOS nodes to apply transactional changes
      become: true
      ansible.builtin.reboot:
        reboot_timeout: 900
      when: ansible_os_family == "Suse"
