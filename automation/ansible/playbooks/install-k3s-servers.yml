---
- name: Install first k3s server (cluster-init)
  hosts: k3s_servers
  gather_facts: true
  tasks:
    - name: Check if k3s server is already installed
      become: true
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service

    - name: Install first k3s server
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_CHANNEL={{ k3s_channel }} \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          sh -s - server \
          --cluster-init \
          --tls-san {{ k3s_api_endpoint }} \
          --cluster-cidr {{ k3s_cluster_cidr }} \
          --service-cidr {{ k3s_service_cidr }} \
          {% for comp in k3s_disable_components %}--disable {{ comp }} {% endfor %}
      args:
        executable: /bin/bash
      when:
        - inventory_hostname == groups['k3s_servers'][0]
        - not k3s_service.stat.exists

- name: Install additional k3s servers
  hosts: k3s_servers
  gather_facts: true
  tasks:
    - name: Read token from first server
      become: true
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      delegate_to: "{{ groups['k3s_servers'][0] }}"
      register: k3s_token_slurp
      run_once: true

    - name: Set join token fact
      ansible.builtin.set_fact:
        k3s_join_token: "{{ k3s_token_slurp.content | b64decode | trim }}"

    - name: Check if k3s server is already installed
      become: true
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s.service
      register: k3s_service

    - name: Install joining k3s server
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_CHANNEL={{ k3s_channel }} \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          K3S_TOKEN={{ k3s_join_token }} \
          sh -s - server \
          --server https://{{ k3s_api_endpoint }}:6443 \
          --tls-san {{ k3s_api_endpoint }} \
          --cluster-cidr {{ k3s_cluster_cidr }} \
          --service-cidr {{ k3s_service_cidr }} \
          {% for comp in k3s_disable_components %}--disable {{ comp }} {% endfor %}
      args:
        executable: /bin/bash
      when:
        - inventory_hostname != groups['k3s_servers'][0]
        - not k3s_service.stat.exists
