---
- name: Upgrade k3s servers one by one
  hosts: k3s_servers
  serial: 1
  gather_facts: true
  tasks:
    - name: Upgrade k3s server
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          sh -
      args:
        executable: /bin/bash
      changed_when: true

- name: Upgrade k3s agents in batches
  hosts: k3s_agents
  serial: 2
  gather_facts: true
  tasks:
    - name: Upgrade k3s agent
      become: true
      ansible.builtin.shell: |
        set -euo pipefail
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION={{ k3s_version }} \
          INSTALL_K3S_EXEC=agent \
          sh -
      args:
        executable: /bin/bash
      changed_when: true
