k3s_channel: stable
k3s_server_extra_args: []
k3s_agent_extra_args: []
k3s_version: v1.32.3+k3s1
# k3s_api_endpoint is read dynamically from the first master's ansible_host
# k3s_lb_ip: optional — set to a Hetzner LB IP to include as tls-san, or leave
# empty and the playbook will auto-detect any LB named "k3s-cluster-api-lb"
k3s_lb_ip: ""
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_disable_components: []
base_packages:
  - curl
  - jq
  - vim
  - htop
  - ca-certificates
  - tar

kernel_modules:
  - overlay
  - br_netfilter

sysctl_settings:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

nvidia_microos_packages:
  - nvidia-open-driver-G06-signed-kmp-meta
  - nvidia-compute-utils-G06
  - nvidia-container-toolkit
